name: WebGuard guarded regression

on:
  push:
    branches:
      - fix/assignment-rubric-compliance
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTEST_ADDOPTS: ""
      PYTEST_PLUGINS: ""
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14.5"
      - name: Install declared dependencies and record environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP 'webguard-ci-evidence'
          New-Item -ItemType Directory -Path $evidence -ErrorAction Stop | Out-Null
          git rev-parse HEAD | Set-Content (Join-Path $evidence 'commit.txt')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import sys, ssl; print(sys.version); print(ssl.OPENSSL_VERSION); print(sys.platform)" | Set-Content (Join-Path $evidence 'runtime.txt')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip freeze | Set-Content (Join-Path $evidence 'dependencies.txt')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run full guarded regression
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP 'webguard-ci-evidence'
          $env:WG_CI_EVIDENCE = $evidence
          $env:PYTHONPATH = "$(Join-Path $env:GITHUB_WORKSPACE '.github/ci');$env:GITHUB_WORKSPACE"
          Remove-Item Env:SSLKEYLOGFILE, Env:SSL_CERT_FILE, Env:SSL_CERT_DIR -ErrorAction SilentlyContinue
          python -B .github/ci/run_regression.py 2>&1 | Tee-Object -FilePath (Join-Path $evidence 'pytest.txt')
          $code = $LASTEXITCODE
          exit $code
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: webguard-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/webguard-ci-evidence/
          if-no-files-found: warn
          retention-days: 14
